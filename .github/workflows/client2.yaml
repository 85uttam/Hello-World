name: Client 2 - Run on Sunday 10:00 AM IST

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 0'  # 7 AM IST = 4:30 UTC on Sunday

jobs:
  client2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Client 2 TestNG Suite
        run: mvn test -DsuiteXmlFile=testng2.xml
