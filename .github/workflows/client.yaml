name: Client 1 - Run on Saturday 6:45 PM IST

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 6'  # 6:45 PM IST = 13:15 UTC

jobs:
  client1-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Client 1 TestNG Suite
        run: mvn test -DsuiteXmlFile=testng.xml
