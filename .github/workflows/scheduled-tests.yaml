name: Run Different TestNG Suites on Different Days

on:
  schedule:
#    - cron: '15 13 * * 1'  # Monday    (client1)
#    - cron: '30 3 * * 2'  # Tuesday   (client2)
#   - cron: '30 3 * * 3'  # Wednesday (client3)
#  - cron: '30 3 * * 4'  # Thursday  (client4)
#    - cron: '30 3 * * 5'  # Friday    (client5)

jobs:
  client1-tests:
    if: github.event.schedule == '15 13 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Client 1 Tests
        run: mvn test -DsuiteXmlFile=testng.xml

  client2-tests:
    if: github.event.schedule == '15 13 * * 6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Client 2 Tests
        run: mvn test -DsuiteXmlFile=testng2.xml
        
        
        # Repeat for client3, client4, client5...
